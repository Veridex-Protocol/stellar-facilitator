name: Veridex x402 Stellar CI

# Two things happen here.
#
# `unit` is the usual: typecheck, build, tests, container config. It proves the
# code compiles and its own assertions hold.
#
# `conformance` is the one that matters for anything we publish. It spends real
# Stellar testnet XLM: it creates fresh Friendbot-funded accounts on every run,
# brings the stack up with docker compose, and makes a stock x402 client from
# public npm pay for a resource on stellar:testnet, then re-reads the settlement
# from Horizon. Nothing is mocked and no secrets are needed - which is the
# point: anyone can fork this repository and get the same green run.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: error registry + dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run errors:check
      - run: npm run licenses:check

  node:
    name: typecheck + build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [facilitator-service, bazaar-service, demo-server, mcp-server, sdk-typescript, playground]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.package }}
      - run: npm run typecheck
        working-directory: ${{ matrix.package }}
      - run: npm run build
        working-directory: ${{ matrix.package }}
      - name: Test packages that contain tests
        if: matrix.package != 'demo-server' && matrix.package != 'playground'
        run: npm test -- --run
        working-directory: ${{ matrix.package }}

      - name: Canonical buyer facade proof
        if: matrix.package == 'sdk-typescript'
        run: npm test -- --run src/__tests__/veridex-client.test.ts
        working-directory: sdk-typescript

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK dependencies
        run: pip install requests
      - run: python -m compileall -q veridex
        working-directory: sdk-python
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        working-directory: sdk-python

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go vet ./...
        working-directory: sdks/go
      - run: go test ./... -v
        working-directory: sdks/go

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/upto-settlement
      - run: cargo test --locked
        working-directory: contracts/upto-settlement

  containers:
    name: compose config + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Placeholders only: this job validates and builds, it never runs the
      # stack. The conformance job below uses real Friendbot-funded accounts.
      - name: Validate compose configuration
        env:
          BAZAAR_INTERNAL_TOKEN: ci-placeholder-token-not-a-real-secret
          FACILITATOR_PUBLIC_KEY: GCNNJJV3XUXWCVV3WBKILBCUUGKSDZ2BL4HHNV7AISYMW6PJQX47DZYU
          FACILITATOR_SECRET_KEY: unused-in-config-check
          SELLER_ADDRESS: GCNNJJV3XUXWCVV3WBKILBCUUGKSDZ2BL4HHNV7AISYMW6PJQX47DZYU
          PAYMENT_ASSET: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
        run: docker compose config --quiet
      - run: docker compose build facilitator bazaar demo-server mcp-server

  conformance:
    name: stock client pays on testnet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm run install:all

      - name: Create and fund testnet accounts
        run: npm run setup

      - name: Start the stack
        run: docker compose up --build -d postgres bazaar facilitator demo-server

      - name: Wait for health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1 \
               && curl -fsS http://localhost:3002/health >/dev/null 2>&1 \
               && curl -fsS http://localhost:3003/health >/dev/null 2>&1; then
              echo "all services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "services did not become healthy" >&2
          docker compose logs >&2
          exit 1

      - name: Run conformance harness
        run: npm run conformance

      - name: Show the settled transaction
        if: always()
        run: |
          if [ -f conformance-report.json ]; then
            node -e "
              const report = require('./conformance-report.json');
              console.log('settled transaction:', report.settledTransaction);
              console.log('explorer:', report.explorerUrl);
              console.log('checks:', report.passed, 'passed,', report.failed, 'failed');
            "
          fi

      - name: Summarize request outcomes
        if: always()
        run: |
          docker compose logs --no-log-prefix facilitator \
            | node scripts/summarize-outcomes.mjs || true

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json

      - name: Service logs
        if: failure()
        run: docker compose logs
