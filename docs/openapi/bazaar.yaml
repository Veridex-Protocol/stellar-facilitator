openapi: 3.0.3
info:
  title: Veridex Bazaar v2 API
  version: 0.2.0
  license: { name: Apache-2.0 }
servers:
  - url: http://localhost:3001
paths:
  /discovery/search:
    get:
      summary: Search live x402 resources using text, vector, and telemetry ranking
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
        - { in: query, name: network, schema: { type: string, default: 'stellar:pubnet' } }
        - { in: query, name: minUptimeRatio, schema: { type: number, minimum: 0, maximum: 1, default: 0.9 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Ranked resource results }
        '400': { description: Missing query }
  /discovery/resources:
    get:
      summary: List catalog resources
      parameters:
        - { in: query, name: network, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses: { '200': { description: Catalog page } }
  /announce:
    post:
      summary: Validate and relay a signed P2P announcement
      responses:
        '200': { description: Announcement published }
        '400': { description: Invalid announcement }
  /catalog/ingest:
    post:
      summary: Ingest verified Bazaar discovery metadata
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Resource indexed }
        '400': { description: Metadata soft-dropped }
        '401': { description: Invalid internal token }
  /health:
    get:
      summary: Database and P2P health
      responses: { '200': { description: Health status } }
  /stats:
    get:
      summary: Mesh and telemetry statistics
      responses: { '200': { description: Statistics } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
