# Veridex Stellar Facilitator v2.0 Docker Compose
# License: Apache-2.0
#
# Complete stack:
# - PostgreSQL with pgvector
# - Bazaar Discovery Service
# - Facilitator Settlement Service
# - MCP Discovery Server

services:
  # PostgreSQL database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veridex-postgres
    environment:
      POSTGRES_DB: veridex_bazaar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DATABASE_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./bazaar-service/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Bazaar Discovery Service
  bazaar:
    build:
      context: ./bazaar-service
      dockerfile: Dockerfile
    container_name: veridex-bazaar
    ports:
      - "3001:3001"
      - "4001:4001"  # P2P libp2p
      - "4002:4002"  # P2P WebSocket transport
    environment:
      # HTTP Server
      BAZAAR_PORT: 3001
      BAZAAR_HOST: 0.0.0.0

      # Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: veridex_bazaar
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSL: false

      # P2P Mesh
      P2P_LISTEN_ADDRS: /ip4/0.0.0.0/tcp/4001,/ip4/0.0.0.0/tcp/4002/ws
      P2P_BOOTSTRAP_PEERS: ""
      STELLAR_SECRET_KEY: ${BAZAAR_STELLAR_SECRET_KEY:-}
      P2P_ANNOUNCED_RESOURCES: ${P2P_ANNOUNCED_RESOURCES:-[]}
      PROVIDER_AGGREGATE_ISSUER_SECRET_KEY: ${PROVIDER_AGGREGATE_ISSUER_SECRET_KEY:-${FACILITATOR_SECRET_KEY}}
      PROVIDER_AGGREGATE_AUTHORIZED_ISSUERS: ${PROVIDER_AGGREGATE_AUTHORIZED_ISSUERS:-${FACILITATOR_PUBLIC_KEY}}
      PROVIDER_QUALITY_AUTHORIZED_SIGNERS: ${PROVIDER_QUALITY_AUTHORIZED_SIGNERS:-${SELLER_ADDRESS}}

      # Required. Guards /catalog/ingest, which writes to the public catalog.
      BAZAAR_INTERNAL_TOKEN: ${BAZAAR_INTERNAL_TOKEN:?set BAZAAR_INTERNAL_TOKEN - run npm run setup}

      # Used to confirm the settlement behind every catalog entry.
      HORIZON_URL: ${HORIZON_URL:-https://horizon-testnet.stellar.org}
      BAZAAR_BASE_URL: ${BAZAAR_BASE_URL:-http://localhost:3001}

      # Logging
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Facilitator Settlement Service
  facilitator:
    build:
      context: ./facilitator-service
      dockerfile: Dockerfile
    container_name: veridex-facilitator
    ports:
      - "3002:3002"
    environment:
      # HTTP Server
      FACILITATOR_PORT: 3002
      FACILITATOR_HOST: 0.0.0.0

      # Stellar Network
      STELLAR_NETWORK: testnet
      FACILITATOR_PUBLIC_KEY: ${FACILITATOR_PUBLIC_KEY}
      FACILITATOR_SECRET_KEY: ${FACILITATOR_SECRET_KEY}

      # Public origin advertised in /.well-known/x402. Required: the descriptor
      # states where clients reach this service, which a bind address cannot.
      BASE_URL: ${BASE_URL:-http://localhost:3002}

      # Confirmed against Horizon at boot; the process refuses to start if it
      # would advertise sponsorship from an unfunded account.
      SPONSOR_FEES: ${SPONSOR_FEES:-true}

      # upto is advertised only when a real contract is confirmed on-chain.
      # Leave unset until one is deployed.
      UPTO_ESCROW_CONTRACT_ID_TESTNET: ${UPTO_ESCROW_CONTRACT_ID_TESTNET:-}

      # Jobs advertised in the capability descriptor. None by default.
      X402_JOBS_FILE: ${X402_JOBS_FILE:-}

      MAX_TRANSACTION_FEE_STROOPS: ${MAX_TRANSACTION_FEE_STROOPS:-1000000}
      LEDGER_SKEW_RETRIES: ${LEDGER_SKEW_RETRIES:-2}
      LEDGER_SKEW_RETRY_DELAY_MS: ${LEDGER_SKEW_RETRY_DELAY_MS:-6000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}

      # Channel Account Pool
      HORIZON_URL: ${HORIZON_URL:-https://horizon-testnet.stellar.org}
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      CHANNEL_POOL_SIZE: ${CHANNEL_POOL_SIZE:-0}
      CHANNEL_SECRET_KEYS: ${CHANNEL_SECRET_KEYS:-}
      CHANNEL_AUTO_CREATE: ${CHANNEL_AUTO_CREATE:-false}
      CHANNEL_COOLDOWN_MS: 5000
      CHANNEL_STARTING_BALANCE: "5"
      CHANNEL_REFILL_THRESHOLD: "2"
      CHANNEL_REFILL_AMOUNT: "3"
      BAZAAR_URL: http://bazaar:3001
      BAZAAR_INTERNAL_TOKEN: ${BAZAAR_INTERNAL_TOKEN:-}

      # Logging
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      bazaar:
        condition: service_healthy

  # Demo resource server - the seller the conformance harness buys from
  demo-server:
    build:
      context: ./demo-server
      dockerfile: Dockerfile
    container_name: veridex-demo-server
    ports:
      - "3003:3003"
    environment:
      DEMO_SERVER_PORT: 3003
      FACILITATOR_URL: http://facilitator:3002
      SELLER_ADDRESS: ${SELLER_ADDRESS}
      PROVIDER_OUTCOME_SECRET_KEY: ${PROVIDER_OUTCOME_SECRET_KEY:-${SELLER_SECRET_KEY}}
      PAYMENT_ASSET: ${PAYMENT_ASSET}
      PAYMENT_AMOUNT: ${PAYMENT_AMOUNT:-100000}
      BAZAAR_URL: http://bazaar:3001
      BAZAAR_INTERNAL_TOKEN: ${BAZAAR_INTERNAL_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      facilitator:
        condition: service_healthy

  # Browser-facing sandbox. Holds no keys: visitors' keypairs are generated in
  # their own browser and funded by Friendbot.
  playground:
    build:
      context: ./playground
      dockerfile: Dockerfile
    container_name: veridex-playground
    ports:
      - "3004:3004"
    environment:
      PLAYGROUND_PORT: 3004
      # Reached from the visitor's browser, so these must be the URLs the
      # browser can resolve - not the compose service names.
      FACILITATOR_URL: ${PUBLIC_FACILITATOR_URL:-http://localhost:3002}
      DEMO_SERVER_URL: ${PUBLIC_DEMO_SERVER_URL:-http://localhost:3003}
      BAZAAR_URL: ${PUBLIC_BAZAAR_URL:-http://localhost:3001}
      STELLAR_NETWORK: testnet
      PAYMENT_ASSET: ${PAYMENT_ASSET}
      # The proxy reaches the seller from inside the network, so it is
      # allowlisted for both the service name and the public URL.
      PLAYGROUND_ALLOWED_ORIGINS: "http://demo-server:3003,${PUBLIC_DEMO_SERVER_URL:-http://localhost:3003}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3004/api/config"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      demo-server:
        condition: service_healthy

  # MCP Discovery Server (optional)
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: veridex-mcp
    environment:
      BAZAAR_URL: http://bazaar:3001
      FACILITATOR_URL: http://facilitator:3002
      STELLAR_NETWORK: testnet
      STELLAR_CLIENT_SECRET_KEY: ${STELLAR_CLIENT_SECRET_KEY:-$BUYER_SECRET_KEY}
      SOROBAN_RPC_URL: ${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
    depends_on:
      - bazaar
      - facilitator
    profiles:
      - mcp

volumes:
  postgres-data:

networks:
  default:
    name: veridex-network
